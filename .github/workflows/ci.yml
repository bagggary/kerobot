name: Offline foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: cmake -S . -B build -DBUILD_TESTING=ON
      - run: cmake --build build --config Debug
      - run: ctest --test-dir build -C Debug --output-on-failure
      - name: JSON integration on macOS
        if: runner.os == 'macOS'
        run: python tests/test_offline.py build/kerobot_offline
      - name: JSON integration on Windows
        if: runner.os == 'Windows'
        run: python tests/test_offline.py build/Debug/kerobot_offline.exe
