name: Offline foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Validate demo JSON
        shell: python
        run: |
          import json
          from pathlib import Path
          p = json.loads(Path('build/demo-job/JOB-SYNTHETIC-001/draft.json').read_text())
          assert p['release_eligible'] is False and p['synthetic'] is True
          assert len(p['points_m']) == 11
          assert p['points_m'][0] == [0,0,0] and p['points_m'][-1] == [0.1,0,0]
